<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame Background: 16 · Detail Riwayat Laporan dan Penyerahan -->
  <rect width="1440" height="1000" fill="#FFFFFF"/>

  <!-- Navigasi utama (Satpam - Tab Riwayat Aktif) -->
  <g id="Navigasi utama">
    <rect width="1440" height="80" fill="#FFFFFF"/>
    <rect y="79" width="1440" height="1" fill="#C4C4C4"/>
    <text x="43" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#000000">Lost &amp; Found</text>
    <text x="171" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#0095FF">FIL</text>
    <text x="201" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#FF7300">KOM</text>

    <!-- Nav Tabs Satpam -->
    <g id="Navigasi / Verifikasi Laporan">
      <rect x="520" y="20" width="165" height="40" rx="4" fill="#FFFFFF"/>
      <text x="538" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Verifikasi Laporan</text>
    </g>
    <g id="Navigasi / Kelola Klaim">
      <rect x="691" y="20" width="128" height="40" rx="4" fill="#FFFFFF"/>
      <text x="713" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Kelola Klaim</text>
    </g>
    <g id="Navigasi / Riwayat">
      <rect x="825" y="20" width="94" height="40" rx="10" fill="#6EA9DD"/>
      <text x="845" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Riwayat</text>
    </g>

    <!-- Peran / Satpam -->
    <rect x="1166" y="26" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#999999"/>
    <text x="1180" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#000000">Satpam</text>
    <circle cx="1285" cy="40" r="17" fill="#FFFFFF" stroke="#777777"/>
    <text x="1326" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Keluar</text>
  </g>

  <!-- Isi halaman -->
  <g id="Isi halaman" transform="translate(0, 80)">
    <text x="48" y="40" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#707070">← Kembali ke daftar riwayat</text>
    <text x="48" y="84" font-family="Inter, sans-serif" font-weight="600" font-size="28" fill="#252525">Detail Riwayat Laporan &amp; Penyerahan Barang</text>

    <!-- LEFT CARD: Detail Laporan & Barang (LaporanTemuan, LaporanKehilangan, Barang) -->
    <g id="Detail Barang dan Laporan" transform="translate(48, 136)">
      <rect width="660" height="560" rx="10" fill="#8EBAE0" stroke="#BAFFFD" stroke-opacity="0.5"/>
      <text x="24" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="19" fill="#FFFFFF">Detail Laporan &amp; Barang</text>

      <!-- Badge Status Dikembalikan -->
      <rect x="516" y="22" width="120" height="28" rx="14" fill="#2ACD5B"/>
      <text x="536" y="40" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#414141">Dikembalikan</text>

      <!-- Placeholder Gambar Barang -->
      <g id="Placeholder gambar" transform="translate(24, 72)">
        <rect width="112" height="112" rx="10" fill="#F5F5F5" stroke="#999999"/>
        <text x="22" y="60" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#707070">Foto Barang</text>
      </g>

      <!-- Ringkasan Barang -->
      <text x="160" y="98" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="#FFFFFF">Charger HP Samsung</text>
      <text x="160" y="124" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Kategori: Elektronik  ·  ID Laporan: LAP-2026-014</text>
      <text x="160" y="148" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Deskripsi: Adaptor fast charging 33W warna putih ditemukan</text>
      <text x="160" y="168" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">di dekat stopkontak Ruang F4.2.</text>

      <!-- Baris Data Laporan -->
      <text x="24" y="230" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Pelapor Temuan</text>
      <text x="270" y="230" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Rayhan Wicaksono (265455672234111)</text>
      <rect x="24" y="248" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="278" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Lokasi &amp; Waktu Ditemukan</text>
      <text x="270" y="278" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Ruang F4.2  ·  14 Nov 2026, 13:15 WIB</text>
      <rect x="24" y="296" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="326" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#F8FAFC">Tempat Dititipkan</text>
      <text x="270" y="326" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Resepsionis B</text>
      <rect x="24" y="344" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="374" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Laporan Kehilangan Terkait</text>
      <text x="270" y="374" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">LAP-2026-011 (Reyhan Setya)</text>
      <rect x="24" y="392" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="422" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Ciri Khusus Tersimpan</text>
      <text x="270" y="422" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Adaptor 33W putih, ada stiker inisial RS</text>
      <rect x="24" y="440" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="470" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Status Akhir Laporan</text>
      <text x="270" y="470" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Selesai / Dikembalikan (15 Nov 2026)</text>
    </g>

    <!-- RIGHT CARD: Detail Klaim & Log Riwayat Aktivitas (Klaim & RiwayatAktivitas) -->
    <g id="Detail Klaim dan Riwayat Aktivitas" transform="translate(732, 136)">
      <rect width="660" height="560" rx="10" fill="#8EBAE0" stroke="#BAFFFD" stroke-opacity="0.5"/>
      <text x="24" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="19" fill="#FFFFFF">Detail Klaim &amp; Riwayat Aktivitas</text>

      <text x="24" y="92" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Pengklaim / Pemilik</text>
      <text x="270" y="92" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Reyhan Setya (255150207111078)</text>
      <rect x="24" y="110" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="140" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Tanggal Pengajuan Klaim</text>
      <text x="270" y="140" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">15 November 2026, 09:30 WIB</text>
      <rect x="24" y="158" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="188" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Jawaban Verifikasi</text>
      <text x="270" y="188" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">"Charger putih 33W ada stiker inisial RS"</text>
      <rect x="24" y="206" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="236" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Petugas Verifikasi &amp; Serah Terima</text>
      <text x="270" y="236" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Ariq Dwi Anugrah (SATPAM-02)</text>
      <rect x="24" y="254" width="612" height="1" fill="#FFFFFF"/>

      <text x="24" y="284" font-family="Inter, sans-serif" font-size="14" fill="#F8FAFC">Status Klaim</text>
      <text x="270" y="284" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Disetujui &amp; Barang Diserahkan</text>
      <rect x="24" y="302" width="612" height="1" fill="#FFFFFF"/>

      <!-- Log Riwayat Aktivitas (RiwayatAktivitas - KF 9.3, SD-10) -->
      <text x="24" y="338" font-family="Inter, sans-serif" font-weight="600" font-size="16" fill="#FFFFFF">Log Riwayat Aktivitas (RiwayatAktivitas)</text>
      <g id="Box Log Aktivitas" transform="translate(24, 354)">
        <rect width="612" height="182" rx="8" fill="#FFFFFF"/>
        <text x="16" y="30" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#414141">14 Nov 2026, 13:15  ·  Pelaporan Barang Temuan oleh Rayhan Wicaksono</text>
        <text x="16" y="62" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#414141">14 Nov 2026, 14:00  ·  Verifikasi Laporan Temuan oleh Satpam (Ariq Dwi A.)</text>
        <text x="16" y="94" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#414141">14 Nov 2026, 14:01  ·  Pencocokan Otomatis &amp; Notifikasi ke Pemilik Laporan</text>
        <text x="16" y="126" font-family="Inter, sans-serif" font-weight="500" font-size="13" fill="#414141">15 Nov 2026, 09:30  ·  Pengajuan Klaim Barang oleh Reyhan Setya</text>
        <text x="16" y="158" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#252525">15 Nov 2026, 11:20  ·  Penyerahan Barang &amp; Status Diubah ke 'Dikembalikan'</text>
      </g>
    </g>
  </g>
</svg>
