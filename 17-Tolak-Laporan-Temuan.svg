<svg width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Frame Background: 17 · Tolak Laporan Temuan -->
  <rect width="1440" height="1000" fill="#FFFFFF"/>

  <!-- Navigasi utama Satpam -->
  <g id="Navigasi utama">
    <rect width="1440" height="80" fill="#FFFFFF"/>
    <rect y="79" width="1440" height="1" fill="#C4C4C4"/>
    <text x="43" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#000000">Lost &amp; Found</text>
    <text x="171" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#0095FF">FIL</text>
    <text x="201" y="48" font-family="Impact, Inter, sans-serif" font-size="24" fill="#FF7300">KOM</text>

    <g id="Navigasi / Verifikasi Laporan">
      <rect x="520" y="20" width="165" height="40" rx="10" fill="#6EA9DD"/>
      <text x="538" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Verifikasi Laporan</text>
    </g>
    <g id="Navigasi / Kelola Klaim">
      <rect x="691" y="20" width="128" height="40" rx="4" fill="#FFFFFF"/>
      <text x="713" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Kelola Klaim</text>
    </g>
    <g id="Navigasi / Riwayat">
      <rect x="825" y="20" width="94" height="40" rx="4" fill="#FFFFFF"/>
      <text x="845" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Riwayat</text>
    </g>

    <rect x="1166" y="26" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#999999"/>
    <text x="1180" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#000000">Satpam</text>
    <circle cx="1285" cy="40" r="17" fill="#FFFFFF" stroke="#777777"/>
    <text x="1326" y="45" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#000000">Keluar</text>
  </g>

  <!-- Isi halaman Verifikasi Laporan Temuan (Latar Belakang) -->
  <g id="Isi halaman" transform="translate(0, 80)">
    <text x="48" y="68" font-family="Inter, sans-serif" font-weight="600" font-size="28" fill="#252525">Verifikasi Laporan Temuan</text>

    <!-- Tabel Menunggu Verifikasi (Kiri) -->
    <g id="Menunggu Verifikasi" transform="translate(48, 136)">
      <rect width="660" height="544" rx="10" fill="#8EBAE0"/>
      <text x="24" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="19" fill="#FFFFFF">Menunggu Verifikasi</text>
      <text x="32" y="96" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Barang</text>
      <text x="252" y="96" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Pelapor</text>
      <text x="496" y="96" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF">Status</text>

      <!-- Row 1 Selected -->
      <g transform="translate(24, 115)">
        <rect width="612" height="56" rx="6" fill="#DDDDDD"/>
        <text x="8" y="33" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#414141">Helm</text>
        <text x="225" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#000000">David Wijaya</text>
        <text x="225" y="42" font-family="Inter, sans-serif" font-size="11" fill="#414141">255773822901112</text>
        <rect x="448" y="14" width="148" height="28" rx="14" fill="#FFD60A"/>
        <text x="462" y="32" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#414141">Menunggu Verifikasi</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(24, 180)">
        <rect width="612" height="56" rx="6" fill="#FFFFFF"/>
        <text x="8" y="33" font-family="Inter, sans-serif" font-weight="600" font-size="13" fill="#414141">Payung</text>
        <text x="225" y="25" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#000000">Tiara Andini</text>
        <text x="225" y="42" font-family="Inter, sans-serif" font-size="11" fill="#414141">245340005632112</text>
        <rect x="448" y="14" width="148" height="28" rx="14" fill="#FFD60A"/>
        <text x="462" y="32" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#414141">Menunggu Verifikasi</text>
      </g>
    </g>

    <!-- Detail Laporan Temuan (Kanan) -->
    <g id="Detail Laporan Temuan" transform="translate(732, 136)">
      <rect width="660" height="544" rx="10" fill="#8EBAE0"/>
      <text x="24" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="19" fill="#FFFFFF">Detail Laporan Temuan</text>
      <rect x="24" y="72" width="112" height="112" rx="10" fill="#F5F5F5" stroke="#999999"/>
      <text x="171" y="102" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#F8FAFC">Helm</text>
      <text x="171" y="126" font-family="Inter, sans-serif" font-size="13" fill="#F8FAFC">Deskripsi: Merk KYT warna hitam ditemukan di Junction</text>

      <rect x="24" y="476" width="96" height="44" rx="10" fill="#E87779" stroke="#999999"/>
      <text x="52" y="503" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#F8FAFC">Tolak</text>

      <rect x="136" y="476" width="500" height="44" rx="10" fill="#2ACD5B" stroke="#999999"/>
      <text x="260" y="503" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">Verifikasi &amp; Simpan ke Resepsionis</text>
    </g>
  </g>

  <!-- Rectangle 9 (Dark Overlay - Sama Persis dengan 15 · Batal) -->
  <rect id="Rectangle 9" width="1440" height="1000" fill="#000000" fill-opacity="0.4"/>

  <!-- Modal Tolak Laporan Temuan (AD-05, SD-05 tolakLaporan(laporanId, alasan), MVC-05) -->
  <g id="Modal Tolak Laporan" transform="translate(430, 345)">
    <rect width="580" height="310" rx="10" fill="#FFFFFF"/>

    <!-- Close Button Group 8 -->
    <g id="Tombol Tutup X" transform="translate(516, 24)">
      <rect width="40" height="40" rx="10" fill="none" stroke="#938F99"/>
      <line x1="12" y1="12" x2="28" y2="28" stroke="#938F99" stroke-width="1.5"/>
      <line x1="12" y1="28" x2="28" y2="12" stroke="#938F99" stroke-width="1.5"/>
    </g>

    <!-- Title (#BC0000 - Sama Persis dengan 15 · Batal) -->
    <text x="32" y="52" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#BC0000">Tolak Laporan Temuan?</text>
    <text x="32" y="82" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#000000">Tuliskan alasan penolakan laporan. Status laporan akan diubah menjadi</text>
    <text x="32" y="102" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#000000">Ditolak dan notifikasi dikirimkan ke mahasiswa pelapor.</text>

    <!-- Input Alasan Penolakan -->
    <g id="Input Alasan Penolakan" transform="translate(32, 124)">
      <rect width="516" height="96" rx="8" fill="#F8FAFC" stroke="#938F99"/>
      <text x="16" y="34" font-family="Inter, sans-serif" font-size="14" fill="#737373">cth. Barang fisik belum diserahkan ke resepsionis / data tidak sesuai...</text>
    </g>

    <!-- Tombol Kembali & Ya, tolak laporan -->
    <g id="Kembali" transform="translate(32, 244)">
      <rect width="116" height="40" rx="10" fill="#FFFFFF" stroke="#938F99"/>
      <text x="31" y="25" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#414141">Kembali</text>
    </g>

    <g id="Ya, tolak laporan" transform="translate(388, 244)">
      <rect width="160" height="40" rx="10" fill="#E87779" stroke="#938F99"/>
      <text x="24" y="25" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="#FFFFFF">Ya, tolak laporan</text>
    </g>
  </g>
</svg>
